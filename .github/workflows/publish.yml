name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

        # `packageManager` fait foi : pas de `version:` ici (action-setup@v6).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@groupe-j'

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          # Cross-repo GitHub Packages deps (e.g. @groupe-j/eslint-config) 401
          # during install unless NODE_AUTH_TOKEN carries the org PAT. GITHUB_TOKEN
          # is repo-scoped and can't read a sibling repo's package. Mirrors ci.yml.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Publish
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
