name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # Writes a user-level .npmrc with the @groupe-j auth token. Required
          # because pnpm ignores _authToken lines in the committed project
          # .npmrc (security), so GitHub Packages deps like
          # @groupe-j/eslint-config 401 without this. Mirrors publish.yml.
          registry-url: "https://npm.pkg.github.com"
          scope: "@groupe-j"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
