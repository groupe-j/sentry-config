name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

        # `packageManager` fait foi : pas de `version:` ici (action-setup@v6).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # Writes a user-level .npmrc with the @groupe-j auth token. Required
          # because pnpm ignores _authToken lines in the committed project
          # .npmrc (security), so GitHub Packages deps like
          # @groupe-j/eslint-config 401 without this. Mirrors publish.yml.
          registry-url: "https://npm.pkg.github.com"
          scope: "@groupe-j"

      - name: Auth GitHub Packages
        # pnpm >= 10.34.5 n'expanse plus les variables d'environnement dans les
        # identifiants de registre lus depuis un .npmrc de PROJET. Seule la
        # config utilisateur est encore expansee. Voir GRO-1093.
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "${{ secrets.NPM_TOKEN }}"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # La surface `api-tsdoc` se derive de la PRESENCE du script `docs:api`,
      # jamais de la fraicheur de sa sortie : une reference generee il y a six
      # mois, ou un script casse, passent l'une et l'autre pour vertes. Cette
      # etape regenere et exige un diff vide -- c'est elle qui fait de la
      # reference committee une mesure, et non une decoration.
      - name: Reference d'API a jour
        run: |
          pnpm docs:api
          git diff --exit-code -- api-reference
