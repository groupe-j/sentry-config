name: Dependabot auto-merge
# Auto-merge des PRs Dependabot minor/patch — mais UNIQUEMENT après une CI verte.
#
# Pourquoi deux jobs (label + merge) au lieu d'un simple `gh pr merge --auto` ?
#   `gh pr merge --auto` ne fait QUE poser un flag « merge quand les required
#   checks passent ». Sur un repo SANS branch protection (aucun required check),
#   ce flag se résout IMMÉDIATEMENT → la PR est mergée sans attendre la CI, même
#   si la CI est rouge. C'est ainsi que des bumps Dependabot cassés ont atteint
#   la prod (GRO-625). Ce workflow est SELF-GATING : il ne dépend plus de la
#   branch protection pour bloquer un merge sur CI rouge.
#
# Contrainte technique : `dependabot/fetch-metadata` (détection major/minor/patch)
# EXIGE le contexte `pull_request` — il ne marche PAS en `workflow_run`
# (dependabot/fetch-metadata#490). On sépare donc :
#   - job `label`  (pull_request)  : détecte le semver et POSE un label sur les
#     PRs minor/patch (jamais major). Les runs Dependabot respectent le bloc
#     `permissions:` depuis 2021-10, donc pull-requests:write est bien accordé.
#   - job `merge`  (workflow_run)  : se déclenche à la FIN du workflow « CI » et
#     ne merge que si la CI a réussi ET que la PR porte le label. `workflow_run`
#     tourne depuis la branche par défaut avec un token normal (inscriptible) —
#     PAS le token read-only Dependabot — c'est l'échappatoire recommandée par
#     GitHub pour les opérations privilégiées sur les PRs Dependabot.
#
# Les MAJORS ne reçoivent jamais le label → jamais auto-mergées (review humaine).
#
# Distribué par @groupe-j/dev-conventions (gjdc setup). Aucun prérequis de
# branch protection ; le label `dependabot-auto-merge-ok` est créé
# automatiquement (idempotent) par le job `label`.

on:
  pull_request:
    # ⚠️ Déclarer `types:` REMPLACE le défaut (`opened`/`synchronize`/`reopened`) :
    # les réénumérer est obligatoire, sinon le job `label` ne tourne plus du tout.
    #
    # `edited` est requis pour le retargetage de base : sans lui, une PR Dependabot
    # dont on change la base (`gh pr edit --base staging`) ne repasse jamais par
    # `label`, donc perd son label d'auto-merge et reste bloquée en silence.
    # Le job `label` est bon marché (fetch-metadata + pose d'un label), donc les
    # déclenchements supplémentaires sur édition de titre/corps sont sans effet
    # notable sur les minutes CI.
    types: [opened, synchronize, reopened, edited]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Rattrapage du stock : voir le job `catch-up`. Le declencheur
  # `pull_request` ne peut PAS voir une PR deja ouverte au moment ou ce
  # workflow est depose sur le depot — sans passe periodique, ce stock est
  # orphelin sans limite de duree.
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *" # quotidien, apres la fenetre Dependabot

# Défaut minimal (lecture seule) ; chaque job élève ce dont il a besoin.
permissions:
  contents: read
  pull-requests: read

concurrency:
  # Sérialise par PR/branche pour éviter deux tentatives de merge concurrentes.
  group: dependabot-automerge-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Contexte pull_request : détecte le semver et étiquette minor/patch ──
  label:
    # ⚠️ Ce `name:` est le nom du CHECK RUN interrogé par le job `merge`
    # (env `LABEL_JOB`) pour vérifier que le verdict semver de ce SHA a bien été
    # rendu. Les deux doivent rester synchronisés.
    name: Label auto-mergeable Dependabot PRs
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write # requis par `gh label create` (API labels = surface Issues)
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        # Épinglé sur le SHA complet, jamais sur le tag : un tag est mutable et
        # peut être re-pointé silencieusement par son propriétaire (précédents
        # `tj-actions/changed-files`, `trivy-action`). Cette action s'exécute
        # avec le token du dépôt — le rayon d'explosion d'une reprise de tag est
        # maximal. Règle Semgrep `github-actions-mutable-action-tag`. Le
        # commentaire de fin de ligne porte la version lisible : c'est la forme
        # que Dependabot sait mettre à jour (il réécrit SHA + commentaire).
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure auto-merge label exists
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: |
          gh label create "$LABEL" \
            --repo "$REPO" \
            --color "0e8a16" \
            --description "Dependabot minor/patch cleared for auto-merge once CI is green (GRO-625)" \
            --force
        env:
          LABEL: dependabot-auto-merge-ok
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ Cette etape RETIRE le label. Elle est indispensable parce que
      # l'etiquetage ci-dessous n'AJOUTE jamais qu'il ne retire.
      #
      # Le scenario : Dependabot met a jour une PR EN PLACE (evenement
      # `synchronize`). Une PR etiquetee minor/patch peut ainsi devenir MAJEURE
      # sur la meme branche. Sans retrait, le label survit, et le job `merge`
      # le lit comme une autorisation — il auto-merge alors une majeure, contre
      # l'invariant annonce par ce workflow.
      #
      # ⚠️ PAS de `|| true` / `|| echo` ici. Un tel filet est INCONDITIONNEL :
      # il avale aussi bien le cas benin « label absent » que l'echec d'auth,
      # l'erreur d'API, le depassement de quota ou la coupure reseau. L'etape
      # passerait au VERT en laissant le label perime en place, et le job
      # `merge` merge alors la majeure — c'est un fail-open, la classe de
      # defaut exacte que cette etape est censee fermer. On distingue donc
      # explicitement le cas « rien a retirer » (constate par une lecture) de
      # tous les autres, qui doivent faire ECHOUER l'etape bruyamment.
      - name: Retire le label si la PR n'est plus minor/patch
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-minor' &&
          steps.meta.outputs.update-type != 'version-update:semver-patch'
        run: |
          set -euo pipefail

          # Lecture d'abord : si `gh pr view` echoue (auth/API/reseau), `set -e`
          # fait echouer l'etape au lieu de conclure « absent, rien a faire ».
          labels_json=$(gh pr view "$PR_URL" --json labels)
          has_label=$(echo "$labels_json" | jq -r --arg L "$LABEL" \
            'any(.labels[]?; .name == $L)')

          if [ "$has_label" != "true" ]; then
            echo "Label '$LABEL' absent (verifie) — rien a retirer."
            exit 0
          fi

          # Le label EST present sur une PR qui n'est plus minor/patch : le
          # retrait doit reussir. Tout code de retour non nul propage.
          gh pr edit "$PR_URL" --remove-label "$LABEL"
          echo "Label '$LABEL' retire : update-type=${{ steps.meta.outputs.update-type }}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          LABEL: dependabot-auto-merge-ok
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label minor + patch (never major)
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr edit "$PR_URL" --add-label "$LABEL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          LABEL: dependabot-auto-merge-ok
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Contexte workflow_run : merge SEULEMENT si la CI a réussi ──
  merge:
    name: Merge on green CI
    # ⚠️ Ce job est APPAIRÉ au workflow CI distribué (workflows/ci.yml, `name: CI`),
    # qui se déclenche sur `pull_request`. Le garde ci-dessous exige
    # `workflow_run.event == 'pull_request'` : il évite de re-tourner sur la CI du
    # push vers la branche par défaut consécutif au merge (pas de boucle), MAIS
    # implique que la CI d'une PR Dependabot doit tourner en contexte
    # `pull_request` (c'est le cas de notre ci.yml : `push` n'y écoute que
    # main/staging, pas les branches dependabot/*). Si un repo renomme « CI » ou
    # bascule sa CI de PR en `push`-only, ce merge ne se déclenchera jamais.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read # lecture des check runs du SHA testé (verdict du job `label`)
    steps:
      - name: Resolve PR, gate on author + label + tested SHA, then merge
        run: |
          set -euo pipefail

          # Résout la ou les PR portant ce nom de branche head. On ne consomme
          # QUE des champs de confiance renvoyés par l'API (numéro, auteur,
          # labels, headRefOid) — jamais le titre ni le corps (contrôlés par la
          # source → risque d'injection).
          pr_json=$(gh pr list \
            --repo "$REPO" \
            --head "$HEAD_BRANCH" \
            --state open \
            --json number,author,labels,headRefOid)

          # Sélectionne LA PR de Dependabot. Le `select` sur l'auteur sert de
          # garde-auteur (ne merge jamais que les PRs de Dependabot lui-même) ET
          # protège contre une PR de fork qui réutiliserait le même nom de
          # branche pour se glisser en tête de liste.
          # ⚠️ Le format de `author.login` a DÉJÀ changé une fois : `gh pr list`
          # renvoyait `dependabot[bot]`, il renvoie `app/dependabot` (gh 2.86).
          # Le filtre en dur sur `dependabot[bot]` n'a donc jamais rien matché —
          # le job sortait en `exit 0` « rien a merger », run VERT, et aucune PR
          # n'a été auto-mergée depuis le déploiement (2026-07-06 → 2026-07-25,
          # 44 minor/patch accumulées). On teste donc les deux formats, ancré,
          # et on exige `is_bot` — un compte humain nommé « dependabot » ne
          # passe pas.
          entry=$(echo "$pr_json" | jq -c '
            [ .[]
              | select(.author.is_bot == true)
              | select(.author.login | test("^(app/)?dependabot(\\[bot\\])?$"))
            ] | .[0] // empty')

          if [ -z "$entry" ]; then
            total=$(echo "$pr_json" | jq 'length')
            bot_seen=$(echo "$pr_json" | jq '[.[] | select(.author.is_bot == true)] | length')
            case "$HEAD_BRANCH" in dependabot/*) dep_branch=1 ;; *) dep_branch=0 ;; esac

            # Échec BRUYANT, mais UNIQUEMENT sur le vrai mode de panne : une
            # branche `dependabot/*`, ou un auteur bot qui n'a pas matché. C'est
            # la signature d'un drift de format — celui qui a rendu ce workflow
            # inerte 3 semaines sous un `exit 0` silencieux.
            #
            # ⚠️ NE PAS élargir cette condition. Le job `merge` se déclenche sur
            # CHAQUE CI verte, PRs humaines comprises : un `exit 1` inconditionnel
            # ferait rougir ~85 % des runs (mesuré : 28 branches humaines contre 5
            # branches dependabot sur 33 runs, JELEMENT, 19 jours), avec un message
            # mensonger. Le bruit serait ignoré sous 48 h — et on retomberait
            # exactement dans le mode d'échec que ce correctif ferme.
            if [ "$total" -gt 0 ] && { [ "$dep_branch" = 1 ] || [ "$bot_seen" -gt 0 ]; }; then
              echo "::error::$total PR(s) sur '$HEAD_BRANCH' mais aucune ne passe le garde auteur."
              echo "Auteurs vus : $(echo "$pr_json" | jq -c '[.[].author]')"
              echo "Le format de author.login a probablement changé — corriger le test ci-dessus."
              exit 1
            fi
            echo "Aucune PR Dependabot ouverte pour la branche '$HEAD_BRANCH' — rien a merger."
            exit 0
          fi

          number=$(echo "$entry" | jq -r '.number')
          head_oid=$(echo "$entry" | jq -r '.headRefOid')

          # Garde anti-stale (le cœur du fix GRO-625) : la CI a validé HEAD_SHA.
          # Si Dependabot a rebase/force-push depuis (auto-rebase quand la base
          # bouge), le head courant de la PR a changé → on NE merge PAS un commit
          # non testé. La CI du nouveau head re-déclenchera ce workflow.
          if [ "$head_oid" != "$HEAD_SHA" ]; then
            echo "PR #$number : head '$head_oid' != commit teste par la CI '$HEAD_SHA' (rebase/force-push depuis la CI) — skip, la CI du nouveau head relancera."
            exit 0
          fi

          # ── Autorisation SPÉCIFIQUE AU SHA ────────────────────────────────
          # Le label est un état de PR, pas un état de commit : lu seul, il peut
          # dater d'un SHA antérieur. Sur un `synchronize` qui fait passer une PR
          # déjà étiquetée en MAJEURE, le job `label` (clé de concurrency =
          # numéro de PR) et ce job (clé = branche head) ne se sérialisent PAS
          # entre eux : une CI rapide ou en cache peut amener ici pendant que le
          # retrait du label est encore en file. On lirait alors un label périmé
          # sur un SHA majeur fraîchement testé — et on mergerait la majeure.
          #
          # On exige donc que le job `label` de CE SHA ait CONCLU en succès
          # avant de lire le label. Le check run porte le nom du job et est
          # attaché au head_sha de l'événement `pull_request` — le même SHA que
          # celui testé par la CI.
          verdict=""
          for attempt in $(seq 1 30); do
            verdict=$(gh api \
              "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              --jq '.check_runs' \
              | jq -r --arg N "$LABEL_JOB" \
                '[ .[] | select(.name == $N) ] | .[0]
                 | if . == null then "absent"
                   elif .status != "completed" then "pending"
                   else (.conclusion // "unknown") end')
            [ "$verdict" = "pending" ] || break
            echo "  … job '$LABEL_JOB' encore en cours sur $HEAD_SHA (tentative $attempt/30)"
            sleep 10
          done

          case "$verdict" in
            success) ;;
            skipped)
              # Le job `label` ne tourne que si l'acteur est Dependabot. Skippé
              # ⇒ ce SHA a été poussé par quelqu'un d'autre : aucun verdict
              # semver n'a été rendu pour lui, le label éventuellement présent
              # vient d'un SHA antérieur. On ne merge pas.
              echo "::warning::PR #$number : job '$LABEL_JOB' skippe sur $HEAD_SHA — aucun verdict semver pour ce commit, pas de merge."
              exit 0
              ;;
            pending)
              echo "::error::PR #$number : job '$LABEL_JOB' toujours en cours sur $HEAD_SHA apres 5 min. Le label ne peut pas etre considere comme a jour — pas de merge."
              exit 1
              ;;
            *)
              # `absent` (le workflow de label ne s'est pas declenche sur ce SHA,
              # ou son nom de job a change) ou `failure`/`cancelled`/... :
              # l'autorisation n'est pas verifiable. Echec BRUYANT — on est deja
              # a l'interieur du garde auteur Dependabot, donc pas de bruit sur
              # les PRs humaines, et un skip silencieux ici rejouerait
              # exactement l'inertie de 3 semaines decrite plus haut.
              echo "::error::PR #$number : job '$LABEL_JOB' introuvable ou en echec sur $HEAD_SHA (verdict='$verdict') — autorisation non verifiable, pas de merge."
              echo "Checks vus : $(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" --jq '[.check_runs[].name] | unique | join(", ")')"
              exit 1
              ;;
          esac

          # Relecture APRÈS le verdict : `pr_json` a été capturé avant l'attente
          # et peut être périmé. On revalide aussi le head — il a pu bouger
          # pendant l'attente.
          fresh=$(gh pr view "$number" --repo "$REPO" --json labels,headRefOid)
          head_oid=$(echo "$fresh" | jq -r '.headRefOid')
          has_label=$(echo "$fresh" | jq -r --arg L "$LABEL" 'any(.labels[]?; .name == $L)')

          if [ "$head_oid" != "$HEAD_SHA" ]; then
            echo "PR #$number : head '$head_oid' != '$HEAD_SHA' (a bouge pendant l'attente) — skip."
            exit 0
          fi

          # Garde semver : le label n'est posé que sur minor/patch par le job
          # `label`, et il vient d'être confirmé à jour POUR CE SHA. Une major
          # (ou une PR pas encore étiquetée) → pas de merge.
          # (Résidu de confiance : quiconque a le write access peut poser ce
          # label à la main — mais il pourrait aussi merger la PR à la main ;
          # hors modèle de menace.)
          if [ "$has_label" != "true" ]; then
            echo "PR #$number : label '$LABEL' absent (major ou non etiquetee) — skip."
            exit 0
          fi

          echo "CI verte sur $HEAD_SHA + '$LABEL' verifie pour ce SHA + auteur Dependabot → merge de la PR #$number."
          # --match-head-commit : garde atomique finale contre une course entre
          # le check ci-dessus et l'appel merge (échoue proprement si le head
          # bouge dans l'intervalle, plutôt que de merger un commit non testé).
          gh pr merge "$number" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"
        env:
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          LABEL: dependabot-auto-merge-ok
          # ⚠️ DOIT rester identique au `name:` du job `label` ci-dessus : c'est
          # le nom du check run qu'on interroge pour savoir si le verdict semver
          # de CE SHA a été rendu. Renommer l'un sans l'autre rend le job `merge`
          # rouge (`absent`) — bruyant, donc visible, par construction.
          LABEL_JOB: Label auto-mergeable Dependabot PRs
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Contexte schedule / workflow_dispatch : RATTRAPAGE du stock ────────
  #
  # POURQUOI ce job existe.
  #   Les jobs 1 et 2 ne se déclenchent que sur des ÉVÉNEMENTS de PR :
  #   `pull_request` (label) et la fin de CI d'une PR (merge). Une PR déjà
  #   ouverte au moment où ce workflow est déposé sur le dépôt n'émet aucun de
  #   ces événements tant que Dependabot ne la retouche pas — elle est
  #   structurellement invisible pour l'auto-merge, sans limite de durée.
  #   Mesuré le 2026-08-01 sur l'org : 24 PRs Dependabot ouvertes antérieures au
  #   dépôt de ce workflow sur leur propre dépôt, dont 9 minor/patch jamais
  #   étiquetées. Le cas fondateur est ridesamui-t3#600 (correctif de sécurité
  #   tarteaucitronjs, ouvert le 2026-07-11, workflow déposé le 2026-07-25) :
  #   trois semaines de sommeil.
  #
  # CE QU'IL FAIT DE DIFFÉRENT.
  #   Il ne peut pas utiliser `dependabot/fetch-metadata` (l'action EXIGE le
  #   contexte `pull_request`). Il relit donc la MÊME source que l'action : le
  #   bloc `updated-dependencies:` que Dependabot écrit dans le MESSAGE DE
  #   COMMIT. Ce message est lisible par l'API dans n'importe quel contexte, et
  #   le commit est signé par GitHub — on exige la signature ET l'auteur avant
  #   d'en tirer une conclusion semver.
  #   Il ne peut pas non plus s'appuyer sur le check run du job `label` (absent
  #   par définition sur ces PRs) : il relit l'état COURANT de la CI sur le head
  #   COURANT, et n'accepte que `SUCCESS`/`SKIPPED`/`NEUTRAL` sur la totalité
  #   des checks — jamais un rollup vide.
  #
  # INVARIANT INCHANGÉ : une MAJEURE n'est jamais étiquetée ni mergée.
  catch-up:
    name: Catch-up on pre-existing Dependabot PRs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # requis par `gh label create` (API labels = surface Issues)
      # `gh pr view --json statusCheckRollup` passe par GraphQL et lit DEUX
      # surfaces distinctes : les check runs (Actions) ET les commit statuses
      # (Vercel & autres integrations). Sans ces deux scopes le champ renvoie
      # « Resource not accessible by integration » et, sous `set -e`, fait
      # ECHOUER le rattrapage — constate sur groupe-j/namecheck-v2 (run
      # 30687579048). Le job `merge` n'en avait pas besoin : il lit les checks
      # en REST (`/commits/{sha}/check-runs`), ou `checks: read` suffit.
      #
      # `actions: read` est requis EN PLUS : la requete que `gh` construit pour
      # `statusCheckRollup` descend jusqu'a `checkSuite.workflowRun`, qui releve
      # de la surface Actions. Sans lui l'erreur se deplace simplement d'un cran
      # plus bas (constate sur namecheck-v2 run 30687978319 et mirey run
      # 30687979238) — les trois scopes sont necessaires ensemble.
      checks: read
      statuses: read
      actions: read
    steps:
      # ── Jeton d'application, OPTIONNEL ─────────────────────────────────────
      # 🚨 Dependabot n'obeit pas a `github-actions[bot]` : une commande postee
      # avec `secrets.GITHUB_TOKEN` recoit « Sorry, only users with push access
      # can use that command. » (mesure le 2026-08-09 sur megahote, 3 PRs sur 3).
      # Le degel des PRs en conflit exige donc une AUTRE identite.
      #
      # L'etape est conditionnee a la presence des secrets : sans eux, le job
      # tourne normalement et se contente d'ANNONCER les PRs gelees. Aucun depot
      # ne casse parce que l'application n'y est pas installee.
      #
      # ⚠️ Que Dependabot honore l'identite d'une APPLICATION (qui n'est pas un
      # « user ») n'est PAS garanti par sa documentation. La detection de refus
      # plus bas tranche la question a la premiere execution reelle, et emet un
      # ::warning:: au lieu de compter une reussite imaginaire.
      - name: Jeton d'application pour les commandes Dependabot
        id: apptoken
        if: ${{ vars.DEPENDABOT_CMD_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.DEPENDABOT_CMD_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_CMD_APP_PRIVATE_KEY }}

      - name: Label + merge les PRs que le declencheur pull_request n'a jamais vues
        run: |
          set -euo pipefail

          gh label create "$LABEL" \
            --repo "$REPO" \
            --color "0e8a16" \
            --description "Dependabot minor/patch cleared for auto-merge once CI is green (GRO-625)" \
            --force

          # Garde auteur : meme test ancre + `is_bot` que le job `merge`. Ne pas
          # revenir a une egalite en dur sur `dependabot[bot]` — ce format a deja
          # change une fois (`app/dependabot` depuis gh 2.86) et a rendu le job
          # `merge` inerte pendant trois semaines sous un `exit 0` vert.
          gh pr list \
            --repo "$REPO" \
            --state open \
            --limit 100 \
            --json number,author,labels,headRefOid,mergeStateStatus \
          | jq -c '.[]
              | select(.author.is_bot == true)
              | select(.author.login | test("^(app/)?dependabot(\\[bot\\])?$"))' \
          > "$RUNNER_TEMP/dependabot-prs.jsonl"

          count=$(wc -l < "$RUNNER_TEMP/dependabot-prs.jsonl")
          echo "PRs Dependabot ouvertes : $count"
          merged=0
          recreated=0

          # Lecture sur le descripteur 3, pas sur stdin : les `gh` appeles dans
          # la boucle heriteraient sinon du fichier comme entree standard et
          # pourraient en consommer des lignes.
          while read -r pr <&3; do
            number=$(echo "$pr" | jq -r '.number')
            oid=$(echo "$pr" | jq -r '.headRefOid')
            state=$(echo "$pr" | jq -r '.mergeStateStatus')
            labeled=$(echo "$pr" | jq -r --arg L "$LABEL" 'any(.labels[]?; .name == $L)')

            # ── PRs en CONFLIT : les degeler (GRO-871) ──────────────────────
            # Une PR en conflit n'a pas de `refs/pull/N/merge` calculable, donc
            # GitHub n'y cree AUCUN run `pull_request`. Le job `merge` etant
            # declenche par `workflow_run` de la CI, il ne peut alors JAMAIS
            # s'executer, et ce job-ci ne rattrape rien non plus puisqu'il exige
            # des checks verts qui n'existeront jamais. La PR est gelee
            # DEFINITIVEMENT — sans le moindre rouge pour le signaler : elle n'a
            # pas d'echec, elle n'a RIEN.
            #
            # Le declencheur est mecanique et se reproduit a chaque cycle : des
            # qu'une PR Dependabot fusionne, elle deplace le lockfile et met en
            # conflit toutes ses soeurs. Releve le 2026-08-08 : 29 PRs figees sur
            # 10 depots, dont 9 sur linegroup immobiles depuis le 25 juillet, et
            # 14 paires de doublons nees de Dependabot republiant a cote des
            # gelees. Debloquees a la main ce jour-la ; ce bloc existe pour qu'il
            # n'y ait pas de prochaine fois.
            #
            # `@dependabot recreate` est la sortie : Dependabot ferme la PR
            # LUI-MEME et en republie une propre, sur une base a jour.
            # ⚠️ NE JAMAIS fermer la PR a la main ici a la place : une fermeture
            # manuelle enregistre un ignore IRREVERSIBLE de cette version
            # (`reopen` ne le defait pas), et les deux PRs d'une paire visant la
            # MEME version, fermer l'une peut condamner l'autre.
            # 🚨 `gh pr list --json mergeStateStatus` rend tres souvent UNKNOWN :
            # GitHub calcule la fusionnabilite PARESSEUSEMENT, a la requete
            # INDIVIDUELLE. Tester `= "DIRTY"` sur un instantane de LISTE rate
            # donc sa cible la plupart du temps — et reussit parfois, quand
            # GitHub avait deja calcule. Un instrument qui marche une fois sur
            # deux installe la confiance sans la mériter. Mesure le 2026-08-09
            # sur megahote : 3 PRs `CONFLICTING` cotees `UNKNOWN` dans la liste.
            # (C'est aussi ce qui a rendu faux un releve « 23 conflits → 0 ».)
            if [ "$state" = "UNKNOWN" ]; then
              state=$(gh pr view "$number" --repo "$REPO" --json mergeStateStatus \
                --jq '.mergeStateStatus')
              echo "PR #$number : etat recalcule individuellement → '$state'."
            fi

            if [ "$state" = "DIRTY" ]; then
              # ── Re-lecture AVANT d'agir (meme garde que le chemin de merge) ──
              # `$state` et `$oid` viennent de l'instantane `gh pr list` pris en
              # debut de job. Dependabot a pu rebaser la PR depuis, ou surtout un
              # mainteneur a pu resoudre le conflit A LA MAIN : `recreate`
              # DETRUIRAIT ce travail, puisque Dependabot republie sa branche.
              # C'est le scenario couteux — pas le recreate inutile.
              # On re-lit donc juste avant de poster, et on ne poursuit que si
              # l'etat ET le head sont inchanges. La passe du lendemain verra
              # l'etat frais.
              now=$(gh pr view "$number" --repo "$REPO" --json mergeStateStatus,headRefOid)
              if [ "$(echo "$now" | jq -r '.mergeStateStatus')" != "DIRTY" ] \
                 || [ "$(echo "$now" | jq -r '.headRefOid')" != "$oid" ]; then
                echo "PR #$number : etat ou head modifie depuis l'instantane — pas de recreate."
                continue
              fi
              # Idempotence ancree au SHA : une seule demande par head. Sans
              # cela la passe quotidienne reposterait indefiniment si Dependabot
              # echoue a recreer, et noierait la PR sous ses propres commentaires.
              marker="<!-- gjdc-recreate:$oid -->"
              if gh pr view "$number" --repo "$REPO" --json comments \
                   --jq '[.comments[].body] | join("\n")' | grep -qF "$marker"; then
                echo "PR #$number : en conflit, recreate deja demande pour $oid — skip."
                continue
              fi

              # Sans jeton d'application, inutile de poster : `github-actions[bot]`
              # se fera refuser (voir plus bas). On ANNONCE la PR gelee et on
              # passe — sans marqueur, pour qu'une passe ulterieure reessaie des
              # que l'application est installee.
              if [ -z "${CMD_TOKEN:-}" ]; then
                echo "::warning title=PR Dependabot gelee::PR #$number est en conflit et ne peut pas etre relancee : aucun jeton d'application configure (vars.DEPENDABOT_CMD_APP_ID + secrets.DEPENDABOT_CMD_APP_PRIVATE_KEY). Commenter '@dependabot recreate' a la main en attendant."
                continue
              fi

              # Passage par l'API REST et non `gh pr comment` : ce dernier n'a
              # pas de `--json`, or il faut l'ID du commentaire pour pouvoir le
              # retirer si Dependabot refuse la commande (voir juste apres).
              # `jq -Rs` lit l'entree brute et en fait la chaine `body`.
              # `GH_TOKEN` est surcharge POUR CET APPEL : le commentaire doit
              # venir de l'application, pas de `github-actions[bot]`.
              cid=$(printf '@dependabot recreate\n\n%s\n' "$marker" \
                | jq -Rs '{body: .}' \
                | GH_TOKEN="$CMD_TOKEN" \
                  gh api "repos/${REPO}/issues/${number}/comments" --input - --jq '.id')

              # ── VERIFIER que Dependabot a ACCEPTE la commande ───────────────
              # 🚨 Dependabot n'obeit qu'a un UTILISATEUR ayant un acces en
              # ecriture. Un commentaire poste avec `secrets.GITHUB_TOKEN` vient
              # de `github-actions[bot]` et se fait repondre :
              #     « Sorry, only users with push access can use that command. »
              # Mesure le 2026-08-09 sur groupe-j/megahote — 3 PRs sur 3.
              #
              # Sans ce controle, ce job posterait dans le vide, compterait
              # « 3 relancees », laisserait un marqueur qui INTERDIT toute
              # nouvelle tentative, et sortirait VERT. C'est exactement le
              # mensonge vert que ce fichier est cense eviter ailleurs.
              #
              # En cas de refus : on SUPPRIME notre commentaire (donc le
              # marqueur, pour qu'une passe ulterieure avec un jeton valable
              # reessaie), on n'incremente rien, et on emet un ::warning:: qui
              # NOMME la PR gelee. Une PR gelee visible vaut mieux qu'un
              # compteur menteur.
              # La lecture est SEPAREE du test : en pipant `gh api` dans `grep`,
              # le code de retour du pipeline serait celui de `grep`, et un
              # echec de `gh api` (auth, quota, reseau) se lirait « pas de
              # refus » — donc « commande acceptee ». Fail-open. Ici un echec de
              # `gh api` propage par `set -e`, et `grep -q` est consomme par le
              # `if`, dont l'unique mode d'echec est « aucune correspondance ».
              sleep 10
              reponse=$(gh api "repos/${REPO}/issues/${number}/comments" \
                --jq '[.[] | select(.user.login == "dependabot[bot]")] | last | .body // ""')

              if printf '%s' "$reponse" | grep -q "only users with push access"; then
                # Suppression avec le MEME jeton que la creation : c'est
                # l'application qui a poste, et rien ne garantit que le jeton du
                # job puisse effacer le commentaire d'une autre identite.
                GH_TOKEN="$CMD_TOKEN" \
                  gh api -X DELETE "repos/${REPO}/issues/comments/${cid}" >/dev/null
                echo "::warning title=PR Dependabot gelee::PR #$number est en conflit et Dependabot a REFUSE la commande postee par l'application. Son identite n'est donc pas reconnue comme « user with push access » — commenter '@dependabot recreate' a la main, ou passer a un PAT utilisateur."
              else
                echo "PR #$number : en conflit → '@dependabot recreate' accepte."
                recreated=$((recreated + 1))
              fi
              continue
            fi

            # ── Autorisation SPÉCIFIQUE AU SHA (même principe que le job 2) ──
            # Le job `merge` ne se fie JAMAIS au label seul : avant de merger il
            # exige que le verdict semver ait été rendu POUR LE SHA qu'il merge
            # (le check run du job `label`, attaché à `$HEAD_SHA`). Ce job-ci ne
            # peut pas lire ce check run — il est absent par définition sur les
            # PRs que le déclencheur `pull_request` n'a jamais vues, c'est toute
            # sa raison d'être — mais il dispose de la MÊME autorité liée au
            # commit : le bloc `updated-dependencies:` du message du commit
            # `$oid`, signé par GitHub. Le verdict est donc RECALCULÉ sur le
            # head courant à chaque passe, étiquetée ou non.
            #
            # ⚠️ NE PAS remettre ce bloc à l'intérieur d'un test sur `$labeled`.
            # C'était la forme précédente, et elle rouvrait le fail-open que ce
            # fichier existe pour fermer : le label est un état de PR, pas un
            # état de COMMIT. Une PR étiquetée mineure puis mise à jour EN PLACE
            # vers une majeure conserve son label (Dependabot recycle la branche
            # — scénario documenté plus bas dans ce même job), et le
            # `gh pr merge` de fin de boucle s'exécute inconditionnellement : on
            # mergeait la majeure sur la seule foi d'un label périmé et d'une CI
            # verte. Idem pour un push de mainteneur, qui fait *skipper* le job
            # `label` en laissant survivre le label d'un SHA antérieur.
            # `tests/dependabot-templates.test.ts` échoue si l'imbrication
            # revient.

            # Tester le CODE DE RETOUR, pas la sortie : `gh api` imprime son
            # 404 sur stdout, et `--jq '.champ'` renvoie alors `null` — une
            # chaine non vide qui ferait conclure « present » a un test `-n`.
            if ! commit=$(gh api "repos/${REPO}/commits/${oid}" \
                 --jq '{login: (.author.login // ""), verified: .commit.verification.verified, msg: .commit.message}'); then
              echo "PR #$number : commit $oid illisible — indecidable, pas de merge."
              continue
            fi

            login=$(echo "$commit" | jq -r '.login')
            verified=$(echo "$commit" | jq -r '.verified')
            if [ "$login" != "dependabot[bot]" ] || [ "$verified" != "true" ]; then
              echo "PR #$number : head $oid non signe par Dependabot (login='$login', verified='$verified') — pas de merge."
              continue
            fi

            # `|| true` cantonne a CE grep : son seul mode d'echec est « aucune
            # correspondance », et le cas vide est traite explicitement juste
            # apres. Ne pas l'etendre au reste du pipeline.
            semver=$(echo "$commit" | jq -r '.msg' \
              | grep -oE 'semver-(major|minor|patch)' | sort -u || true)

            if [ -z "$semver" ]; then
              echo "PR #$number : aucune metadonnee semver sur le head $oid — indecidable, pas de merge (review manuelle)."
              continue
            fi
            if echo "$semver" | grep -q 'semver-major'; then
              echo "PR #$number : le head $oid contient un saut MAJEUR — jamais auto-mergee."
              if [ "$labeled" = "true" ]; then
                # Exactement le cas que l'ancienne structure laissait passer.
                echo "::warning::PR #$number porte '$LABEL' alors que son head $oid est MAJEUR — label perime (pose sur un SHA anterieur), merge refuse."
              fi
              continue
            fi

            # Seul l'ÉTIQUETAGE est conditionnel au label ; jamais la vérification.
            if [ "$labeled" != "true" ]; then
              gh pr edit "$number" --repo "$REPO" --add-label "$LABEL"
              echo "PR #$number : etiquetee ($(echo "$semver" | tr '\n' ' '))."
            fi

            # ── Memes gardes de merge que le job 2, mais la CI est RELUE ────
            if [ "$state" != "CLEAN" ]; then
              echo "PR #$number : mergeStateStatus='$state' (attendu CLEAN) — skip."
              continue
            fi

            rollup=$(gh pr view "$number" --repo "$REPO" --json statusCheckRollup,headRefOid)
            if [ "$(echo "$rollup" | jq -r '.headRefOid')" != "$oid" ]; then
              echo "PR #$number : le head a bouge pendant la passe — skip."
              continue
            fi

            total=$(echo "$rollup" | jq '[.statusCheckRollup[]?] | length')
            bad=$(echo "$rollup" | jq '[.statusCheckRollup[]?
                    | (.conclusion // .state // "PENDING")
                    | select(. != "SUCCESS" and . != "SKIPPED" and . != "NEUTRAL")] | length')

            # Un rollup VIDE n'est pas une CI verte : c'est l'absence de preuve.
            # Le refuser explicitement evite de rejouer le fail-open de
            # `gh pr merge --auto` sur un depot sans required checks.
            if [ "$total" -eq 0 ]; then
              echo "PR #$number : aucun check sur $oid — absence de preuve, pas de merge."
              continue
            fi
            if [ "$bad" -ne 0 ]; then
              echo "PR #$number : $bad/$total checks non verts — skip."
              continue
            fi

            echo "PR #$number : minor/patch + $total checks verts sur $oid → merge."
            gh pr merge "$number" --repo "$REPO" --squash --delete-branch --match-head-commit "$oid"
            merged=$((merged + 1))
          done 3< "$RUNNER_TEMP/dependabot-prs.jsonl"

          echo "Rattrapage termine : $merged PR(s) mergee(s), $recreated en conflit relancee(s), sur $count examinee(s)."
        env:
          REPO: ${{ github.repository }}
          LABEL: dependabot-auto-merge-ok
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Vide tant que l'application n'est pas configuree sur le depot. Le
          # script le teste et se contente alors d'annoncer les PRs gelees.
          CMD_TOKEN: ${{ steps.apptoken.outputs.token }}
