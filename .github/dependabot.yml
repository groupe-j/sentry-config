# Dependabot — config par défaut groupe-j
# Monorepos : UNE seule entrée npm, avec `directories:` — voir le pied du fichier.
#
# Le bloc `registries:` donne à Dependabot (security ET version updates) l'accès
# au registry privé GitHub Packages pour résoudre les @groupe-j/*. Sans lui,
# Dependabot n'a qu'une credential git_source github.com et échoue en
# `security_update_not_possible` dès qu'il doit résoudre un package privé.
#
# PRÉREQUIS : secret DEPENDABOT (magasin séparé des secrets Actions !) au niveau
# org, scope read:packages :
#   gh secret set NPM_TOKEN --app dependabot --org groupe-j --visibility all

version: 2

registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.NPM_TOKEN}}

updates:
  # ─── npm dépendances ───
  - package-ecosystem: "npm"
    directory: "/"
    registries:
      - npm-github
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    # Contrepartie OBLIGATOIRE de l'auto-merge minor/patch, installé par le même
    # `gjdc setup` que ce fichier : sans délai, une dépendance compromise
    # publiée il y a dix minutes est mergée sans qu'aucun humain ne la voie —
    # le vecteur des compromissions npm récentes. Plancher 7 jours (plus strict
    # que le défaut GitHub) ; ne pas descendre `semver-patch-days` en dessous :
    # une compromission se déguise volontiers en patch, précisément parce que
    # c'est la mise à jour qu'on relit le moins.
    # Le cooldown ne s'applique JAMAIS aux mises à jour de sécurité — un
    # correctif de faille n'est donc pas retardé.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      # ── UN SEUL groupe mineur/patch écrit `pnpm-lock.yaml` — GRO-1579 ────
      # Sur un dépôt pnpm, TOUTE PR Dependabot réécrit le verrou. L'auto-fusion
      # fusionne la première PR verte ; ses sœurs passent en conflit, et une PR
      # en conflit n'a plus ni merge ref, ni CI, ni auto-fusion : elle est gelée
      # sans le moindre rouge. La seule grandeur réglable est le NOMBRE
      # d'écrivains auto-fusionnables du verrou.
      #
      # DEUX moitiés, dont aucune ne suffit seule :
      #   (1) `all-minor-patch` SANS `patterns:` ;
      #   (2) `update-types: ["major"]` sur CHAQUE groupe de famille.
      #
      # Dependabot affecte une dépendance au groupe le plus SPÉCIFIQUE, où qu'il
      # soit déclaré (`dependabot-core`, lu à `4725d25`) : match exact 1000 ·
      # groupe sans `patterns:` 500 · joker < 100 · `"*"` = 1, le plus BAS. Les
      # groupes dont les `update-types` ne se recoupent pas ne sont pas comparés
      # entre eux : borner les familles aux majeures SUPPRIME la concurrence au
      # lieu de chercher à la gagner. Une famille non bornée reste candidate aux
      # mineures si elle matche en exact (lu dans le code, non mesuré), ou
      # devient un groupe mort dont les majeures repartent en PR unitaires si
      # elle matche par jokers (mesuré le 2026-10-12, blog-generator#61).
      #
      # Familles : seules celles du gabarit qui matchent une dépendance de ce
      # dépôt (relevé du 2026-10-13 sur `package.json`, hors peerDependencies,
      # que Dependabot ne parse pas). En ajouter une, c'est lui donner son
      #`update-types: ["major"]`.
      #
      # CE QUE CECI NE CORRIGE PAS : les majeures ne sont jamais auto-fusionnées,
      # et chaque fusion de `all-minor-patch` les remet en conflit. Leur sortie
      # est un geste HUMAIN : commenter `@dependabot recreate` (une application
      # est refusée, `dependabot-core#9147`). Ne JAMAIS fermer une PR Dependabot
      # à la main : la fermeture enregistre un ignore permanent de la version.
      # 🪤 Le cooldown (7 jours, 30 pour une majeure) retarde l'effet : il ne
      # s'observe pas le lendemain.
      #
      # 🚫 Ni `patterns:` ni `dependency-type:` sur `all-minor-patch`.
      # 🚫 Pas de famille sans `update-types: ["major"]`.
      # Mesures et arbitrage : groupe-j/dev-conventions,
      # `docs/dependabot-lockfile-fratricide.md` (§4 et §4 bis). Garde :
      # `gjdc check`, ligne « Dependabot écrivains du verrou ».
      all-minor-patch:
        update-types: ["minor", "patch"]
      next:
        patterns: ["next", "@next/*", "eslint-config-next"]
        update-types: ["major"]
      types:
        patterns: ["@types/*"]
        exclude-patterns: ["@types/react*"]
        update-types: ["major"]
      sentry:
        patterns: ["@sentry/*"]
        update-types: ["major"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["major"]
      eslint:
        patterns: ["eslint", "eslint-*", "@eslint/*", "typescript-eslint", "@typescript-eslint/*"]
        exclude-patterns: ["eslint-config-next"]
        update-types: ["major"]
      # Sécurité : `applies-to` vaut `version-updates` par défaut. Sans ce
      # groupe, les correctifs de faille partent en PR unitaires, chacune
      # écrivain du verrou — et le cooldown ne les espace jamais. Pas
      # d'`update-types:`, volontairement : une majeure rend le lot majeur, donc
      # relu par un humain. UN SEUL groupe `security-updates` par entrée.
      # ⚖️ Ce groupe est LUI-MÊME un écrivain auto-fusionnable quand le lot est
      # entièrement mineur/patch : le résultat réel est « un écrivain de version
      # + un écrivain de sécurité », pas « un seul écrivain ». Son effet sur un
      # vrai lot de sécurité n'est pas encore mesuré.
      all-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Contrôle manuel sur les majors critiques (breaking changes potentiels)
      # typescript : `tsup` EMBARQUE `rollup-plugin-dts@6.1.1` dans son artefact
      # publié. Ce n'est ni une dépendance du lockfile ni un paquet de
      # `node_modules` — aucune surcharge pnpm ne peut l'atteindre. Cette
      # version ignore TypeScript 7 :
      #   TS 7 -> TypeError: Cannot read properties of undefined
      #           (reading 'useCaseSensitiveFileNames')
      #   TS 6 -> error TS5101 (baseUrl injecté par tsup), levable par
      #           `"ignoreDeprecations": "6.0"` dans tsconfig.json
      # `tsup@8.5.1` est la dernière version publiée (2025-11-12).
      # Condition de sortie : un tsup vendorant `rollup-plugin-dts` >= 6.5.0,
      # dont la peer accepte `^7`. Cf. GRO-249.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]

  # ─── GitHub Actions versions ───
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # `github-actions` ne supporte que `default-days` (pas la ventilation
    # major/minor/patch). 7 jours : une action compromise s'exécute avec les
    # credentials du dépôt et l'accès aux secrets — rayon d'explosion supérieur
    # à celui d'un paquet npm. L'écosystème étant en cadence mensuelle, le
    # délai ne coûte rien.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    ignore:
      # Reusable workflows first-party (repo privé groupe-j/.github), versionnés
      # à la main et injoignables par Dependabot → git_dependencies_not_reachable.
      # Le dependency-name d'un reusable workflow est le CHEMIN COMPLET : glob requis.
      - dependency-name: "groupe-j/.github/*"

# ─── Monorepos (pnpm-workspace.yaml) : UN verrou, donc UNE entrée npm ───
# 🚫 Ne PAS ajouter une entrée npm par répertoire (`/apps/web`,
# `/packages/db`…), chacune avec son groupe `minor-patch` : un workspace pnpm
# n'a qu'UN `pnpm-lock.yaml`, à la racine. N entrées = N PR auto-fusionnables
# sur le MÊME verrou.
# À la place : garder l'UNIQUE entrée npm ci-dessus et y remplacer
# `directory: "/"` par `directories:` (`"/"`, `"/apps/*"`, `"/packages/*"`).
# Cf. le pied du gabarit `github/dependabot.yml` de groupe-j/dev-conventions.
