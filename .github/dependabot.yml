# Dependabot — config par défaut groupe-j
# Pour monorepos (Turborepo), ajouter des entrées par workspace en bas du fichier.
#
# Le bloc `registries:` donne à Dependabot (security ET version updates) l'accès
# au registry privé GitHub Packages pour résoudre les @groupe-j/*. Sans lui,
# Dependabot n'a qu'une credential git_source github.com et échoue en
# `security_update_not_possible` dès qu'il doit résoudre un package privé.
#
# PRÉREQUIS : secret DEPENDABOT (magasin séparé des secrets Actions !) au niveau
# org, scope read:packages :
#   gh secret set NPM_TOKEN --app dependabot --org groupe-j --visibility all

version: 2

registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.NPM_TOKEN}}

updates:
  # ─── npm dépendances ───
  - package-ecosystem: "npm"
    directory: "/"
    registries:
      - npm-github
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    # Contrepartie OBLIGATOIRE de l'auto-merge minor/patch, installé par le même
    # `gjdc setup` que ce fichier : sans délai, une dépendance compromise
    # publiée il y a dix minutes est mergée sans qu'aucun humain ne la voie —
    # le vecteur des compromissions npm récentes. Plancher 7 jours (plus strict
    # que le défaut GitHub) ; ne pas descendre `semver-patch-days` en dessous :
    # une compromission se déguise volontiers en patch, précisément parce que
    # c'est la mise à jour qu'on relit le moins.
    # Le cooldown ne s'applique JAMAIS aux mises à jour de sécurité — un
    # correctif de faille n'est donc pas retardé.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      next:
        patterns: ["next", "@next/*", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      types:
        patterns: ["@types/*"]
        exclude-patterns: ["@types/react*"]
      sanity:
        patterns: ["@sanity/*", "next-sanity", "sanity"]
      sentry:
        patterns: ["@sentry/*"]
      prisma:
        patterns: ["@prisma/*", "prisma"]
      better-auth:
        patterns: ["better-auth", "@better-auth/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "tailwind-merge"]
      radix:
        patterns: ["@radix-ui/*"]
      trpc:
        patterns: ["@trpc/*"]
    ignore:
      # Contrôle manuel sur les majors critiques (breaking changes potentiels)
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]

  # ─── GitHub Actions versions ───
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # `github-actions` ne supporte que `default-days` (pas la ventilation
    # major/minor/patch). 7 jours : une action compromise s'exécute avec les
    # credentials du dépôt et l'accès aux secrets — rayon d'explosion supérieur
    # à celui d'un paquet npm. L'écosystème étant en cadence mensuelle, le
    # délai ne coûte rien.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    ignore:
      # Reusable workflows first-party (repo privé groupe-j/.github), versionnés
      # à la main et injoignables par Dependabot → git_dependencies_not_reachable.
      # Le dependency-name d'un reusable workflow est le CHEMIN COMPLET : glob requis.
      - dependency-name: "groupe-j/.github/*"

